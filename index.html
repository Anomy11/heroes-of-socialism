<style>
  /* one look on purpose: a sheet of ink-and-paper comic heads; the canvas fills the page, the footer sits on it */
  :root{--paper:#eeebe3;--ink:#171614}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);overflow:hidden}
  canvas{display:block;width:100%;height:100%;cursor:pointer;touch-action:none}
  canvas.drag{cursor:grabbing}
  #hud{position:fixed;left:20px;bottom:calc(12px + env(safe-area-inset-bottom, 0px));right:20px;font:italic 13px/1.7 Georgia,'Times New Roman',serif;color:var(--ink);opacity:.7;pointer-events:none;user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #hud b{font-style:normal;font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:11px;margin-right:10px}
  #hud{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;white-space:normal;opacity:1;pointer-events:none}
  #hud .tip{opacity:.7;flex:0 1 auto}
  #bar{display:flex;gap:6px;flex-wrap:wrap;pointer-events:auto}
  #bar button{font:italic 13px/1 Georgia,'Times New Roman',serif;color:var(--ink);background:rgba(251,249,244,.78);border:1px solid rgba(23,22,20,.55);border-radius:3px;padding:5px 9px 5px 6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s,transform .1s;-webkit-tap-highlight-color:transparent}
  #bar button:hover{background:#171614;color:#f3ead6}
  #bar button:active{transform:translateY(1px)}
  #bar button:focus-visible{outline:2px solid #c8302a;outline-offset:2px}
  #bar button[aria-pressed=true]{background:#c8302a;border-color:#8e1f1b;color:#f3ead6}
  #bar kbd{font:600 10px/1 ui-monospace,Menlo,monospace;border:1px solid currentColor;border-radius:3px;padding:2px 4px;margin:0;font-style:normal;opacity:.75}
  @media (max-width:760px),(pointer:coarse){#hud{left:10px;right:10px;font-size:12px}#hud .tip{width:100%;font-size:11.5px}#bar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -10px;padding:0 10px 2px;width:calc(100% + 20px)}#bar::-webkit-scrollbar{display:none}#bar kbd{display:none}#bar button{padding:8px 11px;font-size:13px;flex:0 0 auto}}

<canvas id="c" role="img" aria-label="25 animated comic heads of socialist figures. Click or tap a head for its party trick."></canvas>

  <button data-k="a"><kbd>A</kbd>May Day parade</button><button data-k="r"><kbd>R</kbd>surprise me</button><button data-k="n"><kbd>N</kbd>reshuffle</button><button data-k="g"><kbd>G</kbd>gossip</button><button data-k="w"><kbd>W</kbd>wave</button><button data-k="s"><kbd>S</kbd>sneeze</button><button data-k="f"><kbd>F</kbd>fly</button><button data-k=" "><kbd>space</kbd>group photo</button><button data-k="m" class="snd" aria-pressed="false"><kbd>M</kbd>sound off</button>

<script>
'use strict';
/* ───────────────────────── 1. tiny maths ───────────────────────── */
const PI=Math.PI, TAU=PI*2;
const {sin,cos,abs,min,max,atan2,floor,sqrt,exp,pow,sign,round,asin}=Math;
// Math.hypot is generic and slow in V8; this is the hot path of every pen stroke
const hypot=(a,b,c)=>b===undefined?abs(a):c===undefined?sqrt(a*a+b*b):sqrt(a*a+b*b+c*c);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)};
const ease=t=>t<.5?2*t*t:1-pow(-2*t+2,2)/2;
const easeOut=t=>1-pow(1-clamp(t,0,1),3), easeIn=t=>pow(clamp(t,0,1),3);
const bump=(t,a,b,c,d)=>sstep(a,b,t)*(1-sstep(c,d,t));          // 0 → 1 over a..b, back to 0 over c..d
function hash(n){n=Math.imul(n^n>>>16,0x45d9f3b);n=Math.imul(n^n>>>16,0x45d9f3b);return((n^n>>>16)>>>0)/4294967296}
function noise1(x,seed){const i=floor(x),f=x-i,u=f*f*(3-2*f),s=(seed*104729)|0;return lerp(hash(i*7919+s|0),hash((i+1)*7919+s|0),u)*2-1}
function RNG(seed){let s=seed>>>0;
  const r=()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  r.range=(a,b)=>a+(b-a)*r(); r.int=(a,b)=>floor(r.range(a,b+1)); r.pick=a=>a[floor(r()*a.length)]; r.chance=p=>r()<p;
  r.wpick=o=>{let t=0;for(const k in o)t+=o[k];let x=r()*t;for(const k in o){x-=o[k];if(x<=0)return k}return Object.keys(o)[0]};
  return r}
// one random stream for the whole show, so a seeded film replays exactly
let rand=Math.random;const reseed=s=>{const r=RNG(s);rand=()=>r()};
const rnd=(a,b)=>a+(b-a)*rand(), chance=p=>rand()<p, pick=a=>a[floor(rand()*a.length)];

/* ───────────────────────── 2. paper + ink ───────────────────────── */
const PAPER='#eeebe3', INK='#171614', ACCENT='#cf4a2e', WHITE='#fbf9f4', SKIN='#f4e4d3';
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,paper=null,grain=null,BOIL=0,SC=1,T=0;

function makePaper(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d'),r=RNG(7);
  g.fillStyle='#fff';g.fillRect(0,0,w,h);const k=max(w,h);
  for(let i=0;i<110;i++){const x=r()*w,y=r()*h,rad=r.range(.06,.28)*k,gr=g.createRadialGradient(x,y,0,x,y,rad);
    gr.addColorStop(0,r.chance(.6)?'rgba(128,118,96,.07)':'rgba(160,150,128,.04)');gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr;g.fillRect(x-rad,y-rad,rad*2,rad*2)}
  const vg=g.createRadialGradient(w/2,h*.46,k*.25,w/2,h/2,k*.78);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(90,80,60,.13)');g.fillStyle=vg;g.fillRect(0,0,w,h);
  const t=document.createElement('canvas');t.width=t.height=256;const tg=t.getContext('2d'),id=tg.createImageData(256,256);
  for(let i=0;i<id.data.length;i+=4){const v=r()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=r()*20}
  tg.putImageData(id,0,0);g.globalCompositeOperation='multiply';g.fillStyle=g.createPattern(t,'repeat');g.fillRect(0,0,w,h);return c}
function makeGrain(){const t=document.createElement('canvas');t.width=t.height=200;const g=t.getContext('2d'),id=g.createImageData(200,200),r=RNG(99);
  for(let i=0;i<id.data.length;i+=4){id.data[i]=238;id.data[i+1]=235;id.data[i+2]=227;id.data[i+3]=r()<.08?r()*42:0}
  g.putImageData(id,0,0);return ctx.createPattern(t,'repeat')}

/* a pen stroke = filled ribbon: wobbles along its length, swells in the middle, tapers at the ends.
   colour = ctx.fillStyle, so a stroke can be ink, silver, glow… */
function ink(pts,w,seed,closed,amp,taper){
  const n=pts.length;if(n<2)return;w*=SC;seed=(seed|0)+BOIL*31;
  const d=new Float32Array(n);let L=0;for(let i=1;i<n;i++){L+=hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);d[i]=L}
  if(L<.6){ctx.beginPath();ctx.arc(pts[0][0],pts[0][1],w*.55,0,TAU);ctx.fill();return}
  amp=(amp==null?.62:amp)*SC;const tp=taper==null?8:taper,lx=[],ly=[],rx=[],ry=[];
  for(let i=0;i<n;i++){
    const a=pts[closed?(i-1+n)%n:max(i-1,0)],b=pts[closed?(i+1)%n:min(i+1,n-1)];
    let tx=b[0]-a[0],ty=b[1]-a[1];const tl=hypot(tx,ty)||1;tx/=tl;ty/=tl;
    const t=d[i]/L,s=d[i]*.05/SC,wob=noise1(s+seed*.37,seed)*amp;
    let ww=w*(.8+.32*noise1(s*1.9+4.2,seed+11));if(!closed)ww*=min(1,.28+min(t,1-t)*tp);
    const px=pts[i][0]-ty*wob,py=pts[i][1]+tx*wob;
    lx.push(px-ty*ww*.5);ly.push(py+tx*ww*.5);rx.push(px+ty*ww*.5);ry.push(py-tx*ww*.5)}
  ctx.beginPath();ctx.moveTo(lx[0],ly[0]);for(let i=1;i<n;i++)ctx.lineTo(lx[i],ly[i]);
  if(closed){ctx.closePath();ctx.moveTo(rx[n-1],ry[n-1]);for(let i=n-2;i>=0;i--)ctx.lineTo(rx[i],ry[i]);ctx.closePath()}
  else{for(let i=n-1;i>=0;i--)ctx.lineTo(rx[i],ry[i]);ctx.closePath()}
  ctx.fill()}
function inkC(pts,w,seed,col,closed,amp){const f=ctx.fillStyle;ctx.fillStyle=col;ink(pts,w,seed,closed,amp);ctx.fillStyle=f}
function chaikin(p,closed,it){for(let k=0;k<(it||1);k++){const q=[],n=p.length;if(n<3)return p;if(!closed)q.push(p[0]);
  for(let i=0;i<(closed?n:n-1);i++){const a=p[i],b=p[(i+1)%n];q.push([a[0]*.75+b[0]*.25,a[1]*.75+b[1]*.25],[a[0]*.25+b[0]*.75,a[1]*.25+b[1]*.75])}
  if(!closed)q.push(p[n-1]);p=q}return p}
function path(pts,close){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);if(close)ctx.closePath()}
function fillPoly(pts,col){if(!pts||pts.length<3)return;path(pts,1);ctx.fillStyle=col;ctx.fill();ctx.fillStyle=INK}
function dot(x,y,r){ctx.beginPath();ctx.arc(x,y,r*SC,0,TAU);ctx.fill()}
function circ(x,y,r,col){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=col;ctx.fill();ctx.fillStyle=INK}
function ring(x,y,r,n){const p=[];for(let i=0;i<n;i++){const a=i/n*TAU;p.push([x+cos(a)*r,y+sin(a)*r])}return p}
function ellipsePts(x,y,rx,ry,rot,n){const p=[],c=cos(rot||0),s=sin(rot||0);for(let i=0;i<n;i++){const a=i/n*TAU,u=cos(a)*rx,v=sin(a)*ry;p.push([x+u*c-v*s,y+u*s+v*c])}return p}
// convex hull; big clouds are first thinned to the farthest point per angular bin (same outline, a fraction of the sort)
const HB=new Int32Array(128),HD=new Float64Array(128);
function hull(P){if(P.length>140){let mx=0,my=0;for(const p of P){mx+=p[0];my+=p[1]}mx/=P.length;my/=P.length;HB.fill(-1);
    for(let i=0;i<P.length;i++){const dx=P[i][0]-mx,dy=P[i][1]-my,d=dx*dx+dy*dy,pa=dy>=0?(dx>=0?dy/(dx+dy||1):1+(-dx)/(dy-dx)):(dx<0?2+(-dy)/(-dx-dy):3+dx/(dx-dy)),k=(pa*32|0)&127;if(HB[k]<0||d>HD[k]){HB[k]=i;HD[k]=d}}
    const Q=[];for(let k=0;k<128;k++)if(HB[k]>=0)Q.push(P[HB[k]]);P=Q}
  P.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const n=P.length;if(n<3)return P;const Hh=[];
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  for(let i=0;i<n;i++){while(Hh.length>=2&&cr(Hh[Hh.length-2],Hh[Hh.length-1],P[i])<=0)Hh.pop();Hh.push(P[i])}
  const t=Hh.length+1;for(let i=n-2;i>=0;i--){while(Hh.length>=t&&cr(Hh[Hh.length-2],Hh[Hh.length-1],P[i])<=0)Hh.pop();Hh.push(P[i])}
  Hh.pop();return Hh}
// 2D helpers for props drawn in screen space
const rot2=(x,y,a)=>[x*cos(a)-y*sin(a),x*sin(a)+y*cos(a)];
function xform(pts,x,y,a,s,sx){return pts.map(p=>{const q=rot2(p[0]*s*(sx||1),p[1]*s,a);return [x+q[0],y+q[1]]})}
function glow(x,y,r,col,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.globalAlpha=a==null?1:a;ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.globalAlpha=1;ctx.fillStyle=INK}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}
function mix(h1,h2,t){const a=parseInt(h1.slice(1),16),b=parseInt(h2.slice(1),16),f=(x,y)=>round(lerp(x,y,t));
  return '#'+((1<<24)+(f(a>>16,b>>16)<<16)+(f(a>>8&255,b>>8&255)<<8)+f(a&255,b&255)).toString(16).slice(1)}

/* ───────────────────────── 3. hand-inked comic lettering ─────────────────────────
   every glyph is a few pen strokes on a 4 x 6 grid, drawn with the same ribbon pen */
const GLY={A:[[[0,6],[2,0],[4,6]],[[.8,3.9],[3.2,3.9]]],B:[[[0,0],[0,6]],[[0,0],[2.7,0],[3.5,.8],[3.5,2.1],[2.7,2.9],[0,2.9]],[[2.7,2.9],[3.8,3.8],[3.8,5.1],[2.9,6],[0,6]]],
 C:[[[3.8,1],[3,.1],[1.3,.1],[.3,1.2],[0,3],[.3,4.8],[1.3,5.9],[3,5.9],[3.8,5]]],D:[[[0,0],[0,6]],[[0,0],[2.1,0],[3.5,1.1],[3.9,3],[3.5,4.9],[2.1,6],[0,6]]],
 E:[[[3.6,0],[0,0],[0,6],[3.6,6]],[[0,2.9],[2.7,2.9]]],F:[[[3.6,0],[0,0],[0,6]],[[0,2.9],[2.7,2.9]]],
 G:[[[3.8,1],[3,.1],[1.3,.1],[.3,1.2],[0,3],[.3,4.8],[1.3,5.9],[3,5.9],[3.9,5],[3.9,3.4],[2.2,3.4]]],H:[[[0,0],[0,6]],[[3.8,0],[3.8,6]],[[0,3],[3.8,3]]],
 I:[[[1.6,0],[1.6,6]],[[.4,0],[2.8,0]],[[.4,6],[2.8,6]]],J:[[[3.4,0],[3.4,4.6],[2.6,5.9],[1,5.9],[.2,4.8]]],K:[[[0,0],[0,6]],[[3.6,0],[0,3.7]],[[1.2,2.6],[3.8,6]]],
 L:[[[0,0],[0,6],[3.5,6]]],M:[[[0,6],[0,0],[2.3,3.8],[4.6,0],[4.6,6]]],N:[[[0,6],[0,0],[3.8,6],[3.8,0]]],
 O:[[[2,0],[3.4,.6],[4,3],[3.4,5.4],[2,6],[.6,5.4],[0,3],[.6,.6],[2,0]]],P:[[[0,6],[0,0],[2.8,0],[3.7,.9],[3.7,2.3],[2.8,3.2],[0,3.2]]],
 Q:[[[2,0],[3.4,.6],[4,3],[3.4,5.4],[2,6],[.6,5.4],[0,3],[.6,.6],[2,0]],[[2.4,4.3],[4.1,6.3]]],R:[[[0,6],[0,0],[2.8,0],[3.7,.9],[3.7,2.3],[2.8,3.2],[0,3.2]],[[1.8,3.2],[3.8,6]]],
 S:[[[3.6,.9],[2.8,0],[1.1,0],[.2,.9],[.3,2.2],[1.4,2.9],[2.6,3.2],[3.7,4],[3.7,5.2],[2.8,6],[1,6],[.1,5.1]]],T:[[[0,0],[4,0]],[[2,0],[2,6]]],
 U:[[[0,0],[0,4.5],[.8,5.8],[2,6],[3.2,5.8],[3.9,4.5],[3.9,0]]],V:[[[0,0],[2,6],[4,0]]],W:[[[0,0],[1.1,6],[2.3,2.3],[3.5,6],[4.6,0]]],
 X:[[[0,0],[3.8,6]],[[3.8,0],[0,6]]],Y:[[[0,0],[1.9,3]],[[3.8,0],[1.9,3],[1.9,6]]],Z:[[[.2,0],[3.8,0],[0,6],[3.8,6]]],
 '!':[[[1,0],[.9,4.1]],'.',[.9,5.7]],'?':[[[.3,1],[1.2,0],[2.8,0],[3.6,.9],[3.5,2.2],[2,3.3],[1.9,4.2]],'.',[1.9,5.7]],
 '.':['.',[.5,5.7]],',':[[[.7,5.3],[.3,6.6]]],"'":[[[.6,0],[.4,1.6]]],'-':[[[.5,3],[3.1,3]]],
 '0':[[[2,0],[3.4,.6],[4,3],[3.4,5.4],[2,6],[.6,5.4],[0,3],[.6,.6],[2,0]]],'1':[[[.8,1.2],[2,0],[2,6]],[[.8,6],[3.2,6]]],
 '2':[[[.3,1],[1.2,0],[2.8,0],[3.7,.9],[3.6,2.3],[0,6],[3.8,6]]],'3':[[[.3,.6],[1.2,0],[2.8,0],[3.6,.9],[3.5,2.2],[2.3,2.9],[3.7,3.8],[3.7,5.1],[2.8,6],[1.1,6],[.1,5.2]]],
 '%':[[[3.6,0],[.2,6]],'.',[.7,.9],'.',[3.1,5.1]],
 'Ä':[[[0,6],[2,.7],[4,6]],[[.8,3.9],[3.2,3.9]],'.',[1.1,-.9],'.',[2.9,-.9]],'Ö':[[[2,.5],[3.4,1.05],[4,3.2],[3.4,5.45],[2,6],[.6,5.45],[0,3.2],[.6,1.05],[2,.5]],'.',[1.1,-.9],'.',[2.9,-.9]],
 'Ü':[[[0,.5],[0,4.5],[.8,5.8],[2,6],[3.2,5.8],[3.9,4.5],[3.9,.5]],'.',[1,-.9],'.',[2.9,-.9]],
 '4':[[[3,6],[3,0],[0,4.2],[4,4.2]]],'5':[[[3.6,0],[.4,0],[.2,2.7],[1.6,2.3],[2.9,2.5],[3.7,3.4],[3.7,4.9],[2.8,5.9],[1.1,6],[.1,5.2]]],
 '6':[[[3.4,.5],[2.3,0],[1.2,.2],[.3,1.5],[0,3.4],[.3,5.1],[1.3,6],[2.7,6],[3.7,5],[3.7,3.8],[2.8,3],[1.4,3],[.2,3.8]]],'7':[[[0,0],[3.9,0],[1.4,6]]],
 '8':[[[2,3],[.7,2.4],[.5,1],[1.3,.1],[2.7,.1],[3.5,1],[3.3,2.4],[2,3],[.4,3.8],[.3,5.2],[1.3,6],[2.7,6],[3.7,5.2],[3.6,3.8],[2,3]]],
 '9':[[[3.7,2.2],[2.6,3],[1.2,3],[.3,2.2],[.3,.9],[1.3,0],[2.7,0],[3.7,.9],[3.7,3],[3.3,4.8],[2.3,5.9],[.6,5.6]]],
 '$':[[[3.4,1.1],[2.7,.5],[1.1,.5],[.3,1.3],[.4,2.5],[1.4,3],[2.6,3.2],[3.6,3.9],[3.6,5],[2.8,5.6],[1,5.6],[.2,4.9]],[[1.9,-.4],[1.9,6.4]]],'/':[[[3.6,0],[.2,6]]],'>':[[[.4,.8],[3.6,3],[.4,5.2]]],':':['.',[.9,1.9],'.',[.9,5.4]],' ':[]};
const GW={M:5,W:5,I:3.2,'/':3,'!':2,'.':1.4,',':1.4,"'":1.4,':':1.8,' ':2.4,'1':3.4};
// split long segments so a pen stroke can swell between its ends
function densify(p,step){const q=[p[0]];for(let i=1;i<p.length;i++){const a=p[i-1],b=p[i],n=max(1,Math.ceil(hypot(b[0]-a[0],b[1]-a[1])/step));for(let k=1;k<=n;k++)q.push([lerp(a[0],b[0],k/n),lerp(a[1],b[1],k/n)])}return q}

  if(AUTO&&!h.act&&T>h.nextAct){const crowd=heads.filter(busy).length>heads.length*.25;

function spawnFly(o){const left=o&&o.side!=null?o.side<0:rand()<.5;fly=Object.assign({x:left?-30:W+30,y:rnd(.2,.8)*H,vx:left?300:-300,vy:0,state:'buzz',gx:W/2,gy:H/2,goalAt:0,landAt:T+rnd(3.5,7),lands:0,target:null,trail:[],hunted:false},o||{});return fly}

function drawFX(dt){for(let i=FX.length-1;i>=0;i--){const p=FX[i];p.age+=dt;if(p.age>p.life){FX.splice(i,1);continue}
